<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Caixa</title>
    <style>
        h1{
            background-color: lightgray;
            height: 300px;
            width: 300px;

            /* short-hand
            border-width: 10px;
            border-style: solid;
            border-color: darkgrey;
            */
            border: 10px solid darkgrey;

            /* short-hand
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            
            ou
            
            padding: 10px 10px 10px 10px
            
            ou como todos são inguais: 
            */
            padding: 10px;

            /* short-hand
            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;

            ou

            margin: 10px 10px 10px 10px;

            ou como todos são inguais:

            margin: 10px;
            */

            margin: 20px auto 40px auto;

            /*
            outline: 10px;
            outline-style: dashed;
            outline-color: salmon;
            */

            outline: 10px dashed salmon;
        }

        a{
            border-width: 10px;
            border-style: solid;
            border-color: red;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplod de box-level, mas os <a href="#">links são exemlplos de caixa inline-level.</a> Vamos ver como tudo isso fuciona.</p>
</body>
</html>
