<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonte externas</title>
    <style>
        @font-face {
            font-family: Vampire;
            src: url('fontes/Vampire\ Wars\ Italic.otf') format('opentype'), url('fontes/Vampire\ Wars\ Italic.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            /*
            Tipos de format()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Typography)
            - svg
            */
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            font-family: 'Vampire', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Et, accusamus iure. Molestiae ipsam hic repellendus, dolorum tempore asperiores, suscipit porro numquam, alias modi architecto cupiditate molestias nihil repudiandae blanditiis minus!</p>
</body>
</html>
