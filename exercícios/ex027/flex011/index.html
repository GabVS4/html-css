<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1, h2{
            text-align: center;
        }

        div.container{
            display: flex;
            background-color: lightsalmon;
            margin: 10px 0px;
            flex-flow: row nowrap;

            /*
            Padrão:
            flex-grow: 0;
            flex-shrink: 1;*/
        }

        div.item{
            text-align: center;
            background-color: lightblue;
            border: 1px solid black;
            padding: 20px 0px;

            flex-basis: 250px;
        }

    </style>
</head>
<body>

    <h1>Exemplos para Shrink e Basis diferente de 0 e 1</h1>

    <div class="container">
        <div class="item" style="flex-shrink: 1; flex-grow: 0;">S = 1 | G = 0</div>
        <div class="item" style="flex-shrink: 1; flex-grow: 4;">S = 1 | G = 4</div>
        <div class="item" style="flex-shrink: 1; flex-grow: 0;">S = 1 | G = 0</div>
    </div>

    <div class="container">
        <div class="item" style="flex-shrink: 5; flex-grow: 1;">S = 5 | G = 1</div>
        <div class="item" style="flex-shrink: 0; flex-grow: 1;">S = 0 | G = 1</div>
        <div class="item" style="flex-shrink: 0; flex-grow: 1;">S = 0 | G = 1</div>
    </div>

    <div class="container">
        <div class="item" style="flex-shrink: 0; flex-grow: 2;">S = 0 | G = 2</div>
        <div class="item" style="flex-shrink: 6; flex-grow: 0;">S = 6 | G = 0</div>
        <div class="item" style="flex-shrink: 2; flex-grow: 2;">S = 2 | G = 4</div>
    </div>
</body>
</html>
