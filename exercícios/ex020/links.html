<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /*
        #  = id
        .  = class
        :  = pseudo-class
        :: = pseudo-element
        >  = children

        */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: red;
        }

        a:visited{
            color: darkred;
        }

        a:hover{
            text-decoration: underline;
            color: black;
        }

        a:active{
            color: gold;
        }

        a::before{
            content: '[link] ';
            text-decoration: none;
            font-weight: normal;
            color: darkgrey;
        }

        a::after{
            content: ' [link]';
            text-decoration: none;
            font-weight: normal;
            color: darkgrey;
        }

        .especial{
            background-color: lightcoral;
        }

        .especial::before{
            content: '➡️ ';
        }

        .especial::after{
            content: ' ⬅️';
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/GabVS4" target="_blank" rel="external">Repositório GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/gabrielvasconcelossantos/" target="_blank" rel="external">Perfil Linkedin</a></li>
        <li><a href="https://www.youtube.com/@UghPeople" target="_blank" rel="external" class="especial">Canal do Youtube</a></li>
    </ul>
</body>
</html>
