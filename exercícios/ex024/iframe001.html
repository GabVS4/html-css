<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe{
            height: 500px;
            width: 500px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de iframes</h1>
    <p>acessando o site do 
        <!-- 
        Tamanho padrão do iframe: 300x150px 
        CSS se sobrepõe
        -->

            <a href="https://www.cursoemvideo.com/" target="_blank"> CursoemVideo</a>
        </iframe> para aprender a programar</p>

    <p>O repositório do Guanabara 
        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="300px">

        </iframe> também é bem legal.</p>
</body>
</html>
