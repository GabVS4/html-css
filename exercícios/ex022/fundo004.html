<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamento</title>
    <style>
        div.fundo{
            display: inline-block;
            height: 35vh;
            width: 35vh;
            background-image: url('https://gustavoguanabara.github.io/html-css/imagens/mascote.png');
            background-size: 10vh;
            border: 1px dashed black;
            background-repeat: no-repeat;
        }
        
        div#p1{
            background-position: top left;
        }

        div#p2{
            background-position: top right;
        }

        div#p3{
            background-position: center center;
        }

        div#p4{
            background-position: bottom left;
        }

        div#p5{
            background-position: bottom left;
        }

        div#p6{
            background-position: top center;
        }

        div#p7{
            background-position: bottom center;
        }

        div#p8{
            background-position: center left;
        }

        div#p9{
            background-position: center right;
        }
    </style>
</head>
<body>
    <div class="fundo" id="p1"></div>
    <div class="fundo" id="p2"></div>
    <div class="fundo" id="p3"></div>
    <div class="fundo" id="p4"></div>
    <div class="fundo" id="p5"></div>

    <div class="fundo" id="p6"></div>
    <div class="fundo" id="p7"></div>
    <div class="fundo" id="p8"></div>
    <div class="fundo" id="p9"></div>

</body>
</html>
