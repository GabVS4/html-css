<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layount na prática</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        h2{
            text-align: center;
        }

        div.container{
            display: grid;
            grid-template: repeat(3, 80px) / repeat(3, 120px);
            gap: 5px;

            grid-auto-flow: row;

            place-items: auto auto;
            place-content: auto auto;
            
            border: 3px solid blue;
        }

        div.container2{
            display: grid;
            grid-template: repeat(3, 80px) / repeat(3, 120px);
            gap: 5px;

            grid-auto-rows: 80px;
            grid-auto-columns: 120px;

            grid-auto-flow: row;

            place-items: auto auto;
            place-content: auto auto;
            
            border: 3px solid blue;
        }

        div.container3{
            display: grid;
            grid-template: repeat(3, 80px) / repeat(3, 120px);
            gap: 5px;

            grid-auto-flow: column;

            place-items: auto auto;
            place-content: auto auto;
            
            border: 3px solid blue;
        }

        div.container4{
            display: grid;
            grid-template: repeat(3, 80px) / repeat(3, 120px);
            gap: 5px;

            grid-auto-rows: 80px;
            grid-auto-columns: 120px;

            grid-auto-flow: column;

            place-items: auto auto;
            place-content: auto auto;
            
            border: 3px solid blue;
        }

        div.container5{
            display: grid;
            grid-template: repeat(2, 2fr) 3fr / 1fr 3fr 2fr;
            gap: 5px;

            grid-auto-rows: 2fr;
            grid-auto-columns: 1fr;

            grid-auto-flow: row;

            place-items: auto auto;
            place-content: auto auto;
            
            border: 3px solid blue;
        }

        div.container6{
            display: grid;
            grid-template: repeat(3, 80px) / 100px 40% repeat(2, 1fr);
            gap: 5px;

            grid-auto-rows: 80px;
            grid-auto-columns: 1fr;

            grid-auto-flow: row;

            place-items: auto auto;
            place-content: auto auto;
            
            border: 3px solid blue;
        }

        div.item{
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h2>Sem o grid-auto-rows</h2>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>

    <h2>Com o grid-auto-rows</h2>
    <div class="container2">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>

    <h2>Sem o grid-auto-columns</h2>
    <div class="container3">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>

    <h2>Com o grid-auto-columns</h2>
    <div class="container4">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>

    <h2>Dividindo com frações</h2>
    <div class="container5">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>

    <h2>Misturando medidas</h2>
    <div class="container6">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>
</body>
</html>
